name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install coverage flake8 pytest

      - name: Check for Python errors
        run: flake8 apbs --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=apbs -m pytest test
          python -m coverage report --show-missing | tee coverage.txt
          python -m coverage xml

      - name: Store coverage results
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.python-version }}-coverage
          path: |
            coverage.txt
            coverage.xml
